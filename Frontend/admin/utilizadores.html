<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utilizadores — Hospital Vida Saudável</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="content-area">

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start">

        <!-- Lista utilizadores -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Utilizadores do Sistema</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Nome</th><th>Email</th><th>Role</th><th>Desde</th></tr>
              </thead>
              <tbody id="utilizadoresBody">
                <tr><td colspan="4"><div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Criar utilizador -->
        <div class="card">
          <div class="card-header"><span class="card-title">Novo Utilizador</span></div>
          <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
            <div class="form-group">
              <label>Nome completo *</label>
              <input type="text" id="u_nome" placeholder="Nome"/>
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input type="email" id="u_email" placeholder="email@hospital.com"/>
            </div>
            <div class="form-group">
              <label>Password *</label>
              <input type="password" id="u_pass" placeholder="Mínimo 8 caracteres"/>
            </div>
            <div class="form-group">
              <label>Role *</label>
              <select id="u_role">
                <option value="recepcao">Recepção</option>
                <option value="medico">Médico</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button class="btn btn-primary" onclick="criarUtilizador()" style="width:100%;justify-content:center">
              <i class="fa-solid fa-user-plus"></i> Criar Utilizador
            </button>
          </div>
        </div>

      </div>

      <!-- Alterar a minha password -->
      <div class="card" style="margin-top:24px;max-width:480px">
        <div class="card-header"><span class="card-title">Alterar a Minha Password</span></div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
          <div class="form-group">
            <label>Password actual *</label>
            <input type="password" id="p_atual" placeholder="Password actual"/>
          </div>
          <div class="form-group">
            <label>Nova password *</label>
            <input type="password" id="p_nova" placeholder="Mínimo 8 caracteres"/>
          </div>
          <button class="btn btn-outline" onclick="alterarPassword()" style="width:100%;justify-content:center">
            <i class="fa-solid fa-key"></i> Alterar Password
          </button>
        </div>
      </div>

    </main>
  </div>

  <script src="admin.js"></script>
  <script>
    buildSidebar('utilizadores');
    buildTopbar('Utilizadores');

    // Note: No GET /utilizadores endpoint by default for security
    // We show the current user's info and allow creating new users
    function loadUtilizadores() {
      const user = getUser();
      document.getElementById('utilizadoresBody').innerHTML = `
        <tr>
          <td><strong>${user.nome}</strong></td>
          <td>${user.email}</td>
          <td>${roleBadge(user.role)}</td>
          <td style="font-size:0.82rem;color:var(--text-3)">—</td>
        </tr>
        <tr>
          <td colspan="4" style="text-align:center;padding:16px;font-size:0.84rem;color:var(--text-3)">
            <i class="fa-solid fa-info-circle"></i> Para segurança, apenas o utilizador actual é listado aqui. Crie utilizadores adicionais pelo formulário ao lado.
          </td>
        </tr>`;
    }

    async function criarUtilizador() {
      const nome  = document.getElementById('u_nome').value.trim();
      const email = document.getElementById('u_email').value.trim();
      const pass  = document.getElementById('u_pass').value;
      const role  = document.getElementById('u_role').value;
      if (!nome || !email || !pass) { toast('Preencha todos os campos.', 'error'); return; }
      if (pass.length < 8) { toast('Password deve ter pelo menos 8 caracteres.', 'error'); return; }
      try {
        await api('POST', '/auth/utilizadores', { nome, email, password: pass, role });
        toast(`Utilizador "${nome}" criado com sucesso!`);
        ['u_nome','u_email','u_pass'].forEach(id => document.getElementById(id).value = '');
      } catch (err) { toast('Erro: ' + err.message, 'error'); }
    }

    async function alterarPassword() {
      const atual = document.getElementById('p_atual').value;
      const nova  = document.getElementById('p_nova').value;
      if (!atual || !nova) { toast('Preencha ambos os campos.', 'error'); return; }
      if (nova.length < 8) { toast('Nova password deve ter pelo menos 8 caracteres.', 'error'); return; }
      try {
        await api('PUT', '/auth/password', { password_atual: atual, password_nova: nova });
        toast('Password alterada com sucesso!');
        document.getElementById('p_atual').value = '';
        document.getElementById('p_nova').value  = '';
      } catch (err) { toast('Erro: ' + err.message, 'error'); }
    }

    loadUtilizadores();
  </script>
</body>
</html>
