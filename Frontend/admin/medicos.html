<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Médicos — Painel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="content-area">
      <div class="card">
        <div class="card-header">
          <span class="card-title"><i class="fa-solid fa-user-doctor" style="color:var(--blue)"></i> Médicos</span>
          <div class="card-actions">
            <div class="search-input">
              <i class="fa-solid fa-search"></i>
              <input type="text" id="searchInput" placeholder="Pesquisar médico ou especialidade..."/>
            </div>
            <select class="filter-select" id="filtroEspecialidade">
              <option value="">Todas as especialidades</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Médico</th>
                <th>Especialidade</th>
                <th>Experiência</th>
                <th>CRM</th>
                <th>Estado</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="medicosBody">
              <tr><td colspan="6"><div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> A carregar...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../config.js"></script>
  <script src="admin.js"></script>
  <script>
    buildSidebar('medicos');
    buildTopbar('Médicos');

    let todosMedicos = [];

    function fotoAdmin(url) {
      if (!url) return '../img/medico_4.jpg';
      return url.replace(/^img\//, '../img/');
    }

    function renderMedicos(lista) {
      const body = document.getElementById('medicosBody');
      if (!lista.length) {
        body.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-user-doctor"></i><p>Nenhum médico encontrado.</p></div></td></tr>';
        return;
      }

      body.innerHTML = lista.map(m => `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:12px">
              <img src="${fotoAdmin(m.foto_url)}" alt="${escapeHtml(m.nome)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover" onerror="this.src='../img/medico_4.jpg'"/>
              <div>
                <strong>${escapeHtml(m.titulo || 'Dr.')} ${escapeHtml(m.nome)}</strong>
                <div style="font-size:0.78rem;color:var(--text-3)">ID #${m.id}</div>
              </div>
            </div>
          </td>
          <td>${escapeHtml(m.especialidade || '-')}</td>
          <td>${m.anos_experiencia || 0} anos</td>
          <td>${escapeHtml(m.crm || '-')}</td>
          <td><span class="badge ${m.ativo ? 'badge-confirmada' : 'badge-cancelada'}">${m.ativo ? 'Activo' : 'Inactivo'}</span></td>
          <td>
            <a href="../marcacao.html?medico_id=${m.id}&servico=${encodeURIComponent(m.especialidade || '')}" target="_blank" class="btn btn-sm btn-outline">
              <i class="fa-solid fa-calendar-plus"></i> Marcar
            </a>
          </td>
        </tr>
      `).join('');
    }

    function aplicarFiltros() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const esp = document.getElementById('filtroEspecialidade').value;
      const lista = todosMedicos.filter(m => {
        const texto = `${m.nome || ''} ${m.especialidade || ''} ${m.crm || ''}`.toLowerCase();
        return (!q || texto.includes(q)) && (!esp || m.especialidade === esp);
      });
      renderMedicos(lista);
    }

    async function carregar() {
      try {
        const [medicos, especialidades] = await Promise.all([
          api('GET', '/medicos', null, true),
          api('GET', '/especialidades', null, true),
        ]);
        todosMedicos = medicos;
        const filtro = document.getElementById('filtroEspecialidade');
        filtro.innerHTML += especialidades.map(e => `<option value="${escapeHtml(e.nome)}">${escapeHtml(e.nome)}</option>`).join('');
        renderMedicos(todosMedicos);
      } catch (err) {
        toast('Erro ao carregar médicos: ' + err.message, 'error');
        document.getElementById('medicosBody').innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Erro ao carregar médicos.</p></div></td></tr>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', aplicarFiltros);
    document.getElementById('filtroEspecialidade').addEventListener('change', aplicarFiltros);
    carregar();
  </script>
</body>
</html>
