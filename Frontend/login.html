<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Hospital Vida Saudável</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --blue: #1565c0; --blue-dark: #0d47a1; --blue-mid: #1e88e5;
      --dark: #0d2146; --text: #1a2e4a; --text-2: #4a5568;
      --border: #e2e8f0; --bg: #f7fafd; --white: #fff;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --red: #e53935;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body); background: var(--dark);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    /* Animated background */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--blue-mid); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: #42a5f5; bottom: -100px; right: -100px; animation-delay: 3s; }
    .orb-3 { width: 300px; height: 300px; background: #1565c0; top: 50%; left: 50%; animation-delay: 6s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .login-container {
      position: relative; z-index: 10;
      width: 100%; max-width: 440px; padding: 24px;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px; padding: 44px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px; justify-content: center;
    }
    .logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--blue-mid));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(21,101,192,0.4);
    }
    .logo-text {
      font-family: var(--font-display); font-size: 1.2rem; color: var(--text);
    }
    .login-title {
      font-family: var(--font-display); font-size: 1.8rem;
      color: var(--text); margin-bottom: 6px; text-align: center;
    }
    .login-title em { font-style: italic; color: var(--blue); }
    .login-sub { font-size: 0.88rem; color: var(--text-2); text-align: center; margin-bottom: 32px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label { font-size: 0.84rem; font-weight: 600; color: var(--text); }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #aab4be; font-size: 0.9rem; pointer-events: none;
    }
    .input-wrap input {
      width: 100%; padding: 13px 14px 13px 40px;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 0.93rem; font-family: var(--font-body); color: var(--text);
      background: var(--white); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,101,192,0.09);
    }
    .input-wrap input.error { border-color: var(--red); }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #aab4be;
      font-size: 0.9rem; padding: 4px;
    }
    .toggle-pass:hover { color: var(--blue); }
    .field-error { font-size: 0.78rem; color: var(--red); min-height: 16px; }

    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--blue), var(--blue-mid));
      color: #fff; border: none; border-radius: 9px;
      font-size: 0.95rem; font-weight: 700;
      font-family: var(--font-body); cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
      box-shadow: 0 4px 16px rgba(21,101,192,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(21,101,192,0.4); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .login-error {
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; padding: 12px 16px;
      font-size: 0.86rem; color: #dc2626;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }
    .login-error.hidden { display: none; }

    .back-link {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-top: 24px;
      font-size: 0.84rem; color: var(--text-2);
    }
    .back-link a { color: var(--blue); font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }

    .role-badges {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;
    }
    .role-badge {
      font-size: 0.72rem; font-weight: 600; padding: 4px 10px;
      border-radius: 100px; border: 1px solid var(--border); color: var(--text-2);
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon"><i class="fa-solid fa-plus"></i></div>
        <span class="logo-text">Vida Saudável</span>
      </div>

      <h1 class="login-title">Bem-vindo de <em>volta</em></h1>
      <p class="login-sub">Acesso restrito ao pessoal do hospital</p>

      <div class="role-badges">
        <span class="role-badge"><i class="fa-solid fa-shield-halved"></i> Admin</span>
        <span class="role-badge"><i class="fa-solid fa-user-doctor"></i> Médico</span>
        <span class="role-badge"><i class="fa-solid fa-clipboard-user"></i> Recepção</span>
      </div>

      <div class="login-error hidden" id="loginError">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginErrorMsg">Credenciais inválidas.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="email@vidasaudavel.co.ao" autocomplete="email"/>
          </div>
          <span class="field-error" id="emailErr"></span>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" class="toggle-pass" id="togglePass">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
          <span class="field-error" id="passErr"></span>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span id="btnText"><i class="fa-solid fa-right-to-bracket"></i> Entrar</span>
          <span id="btnLoading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> A entrar...</span>
        </button>
      </form>

      <div class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <a href="index.html">Voltar ao site público</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_URL = (typeof CONFIG !== 'undefined' && CONFIG.API_URL)
      ? CONFIG.API_URL
      : 'http://localhost:3001/api';

    // Toggle password visibility
    document.getElementById('togglePass').addEventListener('click', function() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      // Validação
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailErr').textContent = 'Insira um email válido.';
        document.getElementById('email').classList.add('error');
        valid = false;
      } else {
        document.getElementById('emailErr').textContent = '';
        document.getElementById('email').classList.remove('error');
      }
      if (!password) {
        document.getElementById('passErr').textContent = 'Insira a password.';
        document.getElementById('password').classList.add('error');
        valid = false;
      } else {
        document.getElementById('passErr').textContent = '';
        document.getElementById('password').classList.remove('error');
      }
      if (!valid) return;

      // Loading state
      document.getElementById('btnText').style.display = 'none';
      document.getElementById('btnLoading').style.display = 'flex';
      document.getElementById('btnLogin').disabled = true;
      document.getElementById('loginError').classList.add('hidden');

      try {
        const res  = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.erro || 'Erro ao entrar.');

        // Guardar token e utilizador
        sessionStorage.setItem('hvs_token', data.token);
        sessionStorage.setItem('hvs_user', JSON.stringify(data.utilizador));

        // Redirecionar para o painel
        window.location.href = 'admin/dashboard.html';
      } catch (err) {
        document.getElementById('loginErrorMsg').textContent = err.message;
        document.getElementById('loginError').classList.remove('hidden');
        document.getElementById('btnText').style.display = 'flex';
        document.getElementById('btnLoading').style.display = 'none';
        document.getElementById('btnLogin').disabled = false;
      }
    });

    // Se já está logado, redirecionar
    if (sessionStorage.getItem('hvs_token')) {
      window.location.href = 'admin/dashboard.html';
    }
  </script>
</body>
</html>
